    <title>GoodLang</title>
    <style>
      @keyframes spin-pause {
        0% {
          transform: rotate(0deg);
        }

        /* smooth rotation */
        95% {
          transform: rotate(355deg);
        }

        /* micro-pause at the end */
        100% {
          transform: rotate(360deg);
        }
      }


      input,
      textarea {
        border-color: inherit;
      }

      .highlight-input:focus {
        outline: none;
        box-shadow: none;
        border: 2px solid var(--accent) !important;
      }

      .highlight-input-wrapper:has(.highlight-input-inner:focus) {
        outline: none;
        box-shadow: none;
        border: 2px solid rgba(168, 19, 21, 1) !important;
      }
    </style>
  </head>
  <body style="overflow-x: hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
