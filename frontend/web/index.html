    <style>
      @keyframes spin-pause {
        0% {
          transform: rotate(0deg);
        }

        /* smooth rotation */
        95% {
          transform: rotate(355deg);
        }

        /* micro-pause at the end */
        100% {
          transform: rotate(360deg);
        }
      }

      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus,
      input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 1000px transparent inset !important;
        -webkit-text-fill-color: inherit !important;
        transition: background-color 9999s ease-in-out 0s;
      }

      input,
      textarea {
        border-color: inherit;
      }

      /* global.css — REQUIRED to get a vertical-bar thumb (pseudo-elements can’t be inline)
   Keep it global/theme-owned (same philosophy as your autofill fix). */

      :root {
        /* Optional: if you prefer to inject from theme, you can instead output these vars from App */
      }

      input[type="range"].gl-number-slider {
        -webkit-appearance: none;
        appearance: none;
        background: transparent;
      }

      /* Track */
      input[type="range"].gl-number-slider {
        position: relative;
      }

      /* Track (thin line stays 2px) */
      input[type="range"].gl-number-slider::-webkit-slider-runnable-track {
        height: 2px;
        border-radius: 999px;
        background: rgba(0,0,0,0.10);
      }

      input[type="range"].gl-number-slider::-moz-range-track {
        height: 2px;
        border-radius: 999px;
        background: rgba(0,0,0,0.10);
      }


      /* Thumb — vertical bar */
      input[type="range"].gl-number-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 6px;
        height: 18px;
        border-radius: 2px;
        background: #4e4646;
        border: 1px solid rgba(0,0,0,0.10);
        margin-top: calc((2px - 18px) / 2); /* centers thumb on track */
      }

      input[type="range"].gl-number-slider::-moz-range-thumb {
        width: 6px;
        height: 18px;
        border-radius: 2px;
        background: #4e4646;
        border: 1px solid rgba(0,0,0,0.10);
      }

      input[type="range"].gl-number-slider:hover {
        cursor: pointer;
      }

      /* Focus */
      input[type="range"].gl-number-slider:focus-visible::-webkit-slider-thumb {
        box-shadow: 0 0 0 2px #ff6138;
      }
      input[type="range"].gl-number-slider:focus-visible::-moz-range-thumb {
        box-shadow: 0 0 0 2px #ff6138;
      }

      input[type="range"].gl-number-slider::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;

        /* center vertically over track */
        top: 50%;
        transform: translateY(-50%);

        height: 5px; /* ← tick height */
        pointer-events: none;

        background:
                repeating-linear-gradient(
                        to right,
                        rgba(0,0,0,0.18) 0px,
                        rgba(0,0,0,0.18) 1px,
                        transparent 1px,
                        transparent calc(100% / var(--gl-steps))
                );
      }
