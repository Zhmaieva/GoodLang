<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StepLang</title>
    <style>
        :root {
            --bg: #fff3df;
            --accent: #ff6138;
            --accent-dark: #d74e2a;
            --green: #4ba36e;
            --blue: #3a6ea5;
            --text: #3a2a1d;
            --muted: #a47856;
            --radius: 20px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Poppins', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 960px;
            width: 100%;
            padding: 40px 24px 80px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: end;
            margin-bottom: 32px;
            border-bottom: 3px solid var(--accent);
            padding-bottom: 12px;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 50px;
            height: 50px;
            background: var(--accent);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 800;
            font-size: 20px;
        }

        h1 {
            font-size: 32px;
            margin: 0;
            font-weight: 800;
            color: var(--accent-dark);
            letter-spacing: 0.02em;
        }

        .sub {
            color: var(--muted);
            font-size: 14px;
            max-width: 500px;
        }

        /* ——— Level Switch ——— */
        .level-switch {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .level-btn {
            appearance: none;
            background: #fffdf8;
            color: var(--text);
            border: 2px solid var(--accent);
            border-radius: 999px;
            padding: 8px 14px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 2px 2px 0 var(--accent-dark);
            transition: transform .1s ease, background .15s ease, box-shadow .15s ease;
        }
        .level-btn:hover { transform: translateY(1px); }
        .level-btn.selected {
            background: var(--green);
            color: #fff;
            box-shadow: 2px 2px 0 #2d6f48;
            border-color: #2d6f48;
        }
        .level-btn:disabled { opacity: .6; cursor: not-allowed; }
        .level-btn:focus-visible {
            outline: 3px solid var(--blue);
            outline-offset: 2px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        .card {
            background: #fffdf8;
            border: 3px solid var(--accent);
            border-radius: var(--radius);
            box-shadow: 4px 4px 0 var(--accent-dark);
            padding: 20px;
        }

        .title {
            font-size: 16px;
            text-transform: uppercase;
            color: var(--text);
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 0.05em;
        }

        .ua {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
        }

        .input-wrap {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        textarea {
            flex: 1;
            min-height: 70px;
            border-radius: var(--radius);
            border: 3px solid var(--accent);
            background: #fffaf3;
            padding: 12px 14px;
            font-size: 16px;
            color: var(--text);
            transition: opacity .15s ease;
        }
        textarea:focus { outline: none; border-color: var(--blue); }
        textarea:disabled { opacity: .7; cursor: not-allowed; }

        .btn {
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            border: none;
            border-radius: 999px;
            padding: 12px 20px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            box-shadow: 3px 3px 0 var(--accent-dark);
            width: 100%; /* на всю ширину контейнера */
        }
        .btn:hover { background: var(--accent-dark); transform: translateY(1px); }
        .btn:disabled { opacity: .7; cursor: not-allowed; }

        .result { display: flex; flex-direction: column; gap: 10px; }

        .feedback {
            background: #fffaf3;
            border: 2px dashed var(--accent);
            padding: 12px 14px;
            border-radius: var(--radius);
            color: var(--text);
            min-height: 44px;
        }

        /* Блок правильної відповіді */
        .correct-wrap {
            margin-top: 8px;
            background: #fff;
            border: 2px solid var(--green);
            border-radius: var(--radius);
            box-shadow: 2px 2px 0 #2d6f48;
            padding: 10px 12px;
        }
        .correct-title {
            font-size: 13px;
            font-weight: 800;
            color: var(--green);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: .04em;
        }
        .correct-text {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 15px;
            background: #f4fff7;
            border: 1.5px dashed var(--green);
            border-radius: 12px;
            padding: 8px 10px;
            display: inline-block;
        }

        footer {
            margin-top: 32px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            border-top: 2px solid var(--accent);
            padding-top: 12px;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="brand">
            <div class="logo" aria-hidden="true"></div>
            <div>
                <h1>StepLang</h1>
                <div class="sub">Переклад → короткий фідбек → нове речення згідно твого рівня</div>
            </div>
        </div>

        <!-- Level Switch -->
        <div class="level-switch" role="group" aria-label="Вибір рівня">
            <button class="level-btn selected" data-level="beginner" aria-pressed="true">Beginner</button>
            <button class="level-btn" data-level="intermediate" aria-pressed="false">Intermediate</button>
            <button class="level-btn" data-level="advanced" aria-pressed="false">Advanced</button>
        </div>
    </header>

    <section class="grid">
        <!-- Left: Task & Input -->
        <div class="card panel" aria-live="polite">
            <div class="ua" id="uaTask">Завантаження завдання…</div>

            <div class="input-wrap">
                <textarea id="answer" placeholder="Введіть переклад англійською…" autocomplete="off"></textarea>
                <button id="checkBtn" class="btn" aria-label="Перевірити переклад">Перевірити</button>
            </div>
        </div>

        <!-- Right: Result -->
        <div class="card panel">
            <h2 class="title">Результат</h2>
            <div class="result" id="result">
                <div class="feedback tiny" id="feedbackBox">Порада: перекладіть і натисніть «Перевірити»</div>

                <!-- Показуємо лише якщо відповідь неправильна -->
                <div id="correctBox" class="correct-wrap" hidden>
                    <div class="correct-title">Правильна відповідь</div>
                    <div class="correct-text" id="correctText">—</div>
                </div>
            </div>
        </div>
    </section>

    <footer>© 2025 StepLang</footer>
</div>
<script src="app.js" type="text/javascript"></script>
</body>
</html>
