<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Used by backend to pick the latest email -->
    <meta name="goodlang:created_at" content="{{CREATED_AT_ISO}}" />
    <meta name="goodlang:subject" content="Ти завершив(ла) марафон! 🎉" />

    <title>Завершення марафону GoodLang</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f8f9fc;
            font-family:{{FONT_FAMILY}};
            color: #20243a;
        }

        .wrap {
            width: 100%;
            padding: 20px 12px;
            box-sizing: border-box;
        }

        .card {
            max-width: 640px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #e6e8f1;
            box-shadow: 0 16px 44px rgba(31, 36, 54, 0.08);
            border-radius: 24px;
            overflow: hidden;
        }

        .header {
            background: #ffffff;
            color: #000000;
            padding: 22px 22px 18px;
            border-bottom: 1px solid #e6e8f1;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: -0.4px;
        }

        .body {
            padding: 18px;
            font-size: 16px;
            line-height: 1.5;
            color: #20243a;
        }

        .p {
            margin: 0 0 14px;
        }

        .section {
            margin: 18px 0;
        }

        .bullet {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: flex-start;
        }

        .dot {
            width: 12px;
            height: 12px;
            background: #7477b8;
            border-radius: 50%;
            margin-top: 6px;
            flex-shrink: 0;
        }

        .rules {
            background: #f0f1fb;
            border: 1px solid #e6e8f1;
            border-radius: 16px;
            padding: 12px 14px;
            margin: 14px 0;
        }

        .rule {
            margin-bottom: 8px;
        }

        .rule a {
            color: #7477b8;
            font-weight: 800;
            text-decoration: underline;
        }

        .footer {
            padding: 16px 18px 20px;
            font-size: 14px;
            color: #7d8499;
            border-top: 1px solid #e6e8f1;
        }

        .brand {
            text-decoration: none;
            display: inline-block;
            margin-top: 6px;
            color: #000000;
            padding: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 0.3px;
            user-select: none;
        }
    </style>
</head>

<body>
<div class="wrap">
    <div class="card">
        <div class="header">Good Lang</div>

        <div class="body">
            <p class="p">Привіт!</p>

            <p class="p">
                <strong>Вітаємо 🎉 Завершено 7-денний марафон!</strong><br />
                7 днів — 7 правил — і всі вивчено.
            </p>

            <div class="section">
                <div class="bullet">
                    <div>
                        <strong>Огляд марафону</strong><br />
                        <div class="rule">
                            <a href="https://goodlang.app/analytics" target="_blank">Переглянути твій загальний прогрес</a>
                        </div><br/>
                        Ось список вивчених правил:
                    </div>
                </div>

                <div class="rules">
                    <!-- Dynamic list -->
                    {{#RULES}}
                    <div class="rule">
                        👉 <a href="{{url}}" target="_blank">{{title}}</a>
                    </div>
                    {{/RULES}}
                </div>
            </div>

            <p class="p">
                Пишаємося тобою 💛
            </p>
        </div>

        <div class="footer">
            See you around,<br />
            <span class="brand">Good Lang</span>

            <div style="text-align: right; font-size: 0.65rem; margin-top:10px">
                Не хочеш отримувати ці листи?
                <a href="{{UNSUBSCRIBE_URL}}" style="color:#7d8499; font-weight:700; text-decoration:underline;">
                    Відписатися
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Plain text version -->
<script type="text/plain" id="goodlang-plain">
    Привіт!

    Вітаємо 🎉 Ти завершив(ла) 7-денний марафон!
    7 днів — 7 правил — і ти дійшов(йшла) до кінця.

    Твої правила марафону:
    {{#RULES}}
    - {{title}} → {{url}}
    {{/RULES}}

    Наступний марафон стартує завтра.
    Якщо хочеш — просто продовжуй, і завтра почнеться новий цикл із новими правилами.

    GoodLang
    Відписатися: {{UNSUBSCRIBE_URL}}
</script>
</body>
</html>
