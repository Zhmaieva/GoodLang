<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GoodLang — Gaps Answers (A4)</title>

  <style>
    @page { size: A4; margin: 0; }

    :root{
      --orange: #FE6136;
      --ink: #2b2b2b;
      --paper: #ffffff;

      --padX: 48px;
      --padTop: 48px;
      --padBottom: 46px;
    }

    .sheet{
      width: 794px;
      height: 1123px;
      background: var(--paper);
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.15);
    }

    .guides{ position:absolute; inset:0; pointer-events:none; opacity:.95; }
    .guide{ position:absolute; background: var(--orange); }
    .g-top    { left:0; right:0; top:  28px; height: 3px; }
    .g-bottom { left:0; right:0; bottom:28px; height: 3px; }
    .g-left   { top:0; bottom:0; left: 28px; width: 3px; }
    .g-right  { top:0; bottom:0; right:28px; width: 3px; }

    .watermark{
      position:absolute;
      left:50%;
      top:50%;
      transform: translate(-50%,-50%);
      width: 360px;
      height: 360px;
      opacity: 0.10;
      pointer-events:none;
      user-select:none;
    }
    .watermark img{ width:100%; height:100%; object-fit: contain; }

    .content{
      position:absolute;
      inset:0;
      padding: var(--padTop) var(--padX) var(--padBottom);
      display:flex;
      flex-direction:column;
      gap: 18px;
    }

    .header{
      background: var(--orange);
      height: 74px;
      display:flex;
      align-items:center;
      padding: 0 12px;
      position: relative;
      left: -18px;
      top: -18px;
      width: 710px;
    }
    .header h1{
      margin:0;
      color:#fff;
      font-weight:800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: clamp(18px, 3vw, 46px);
      letter-spacing:.2px;
      text-transform: lowercase;
    }

    .list{
      display:flex;
      flex-direction:column;
      height: 860px;
      justify-content: space-around;
      position: relative;
      top: -10px;
    }

    .item{ display:flex; gap: 14px; align-items:flex-start; }

    .badge{
      width: 36px;
      height: 36px;
      border-radius: 999px;
      background: var(--orange);
      color:#fff;
      font-weight:800;
      font-size: 18px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex: 0 0 auto;
    }

    .sentence{
      margin: 0;
      font-size: 20px;
      font-style: italic;
      line-height: 1.35;
    }

    /* the filled correct chunk (like screenshot answers) */
    .fill{
      font-weight: 800;
      border-bottom: 3px solid var(--orange);
      padding: 0 22px 2px; /* makes underline longer than word */
      display: inline-block;
      transform: translateY(2px);
      white-space: nowrap;
    }

    .logo{
      position: absolute;
      right: 44px;
      bottom: 24px;
      width: 60px;
      height: 60px;
      border-radius: 999px;
      overflow: hidden;
      background: transparent;
    }
    .logo img{ width:100%; height:100%; object-fit: contain; }

    @media print {
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        width: 210mm !important;
        height: 297mm !important;
        background: #fff !important;
      }
      body { display:block !important; }
      .sheet{
        width: 210mm !important;
        height: 297mm !important;
        margin: 0 !important;
        box-shadow: none !important;
        overflow: hidden !important;
      }
    }

    @font-face {
      font-family: "Nunito";
      src: url("data:font/ttf;base64,{{NUNITO}}") format("ttf");
      font-style: normal;
    }
    @font-face {
      font-family: "Nunito";
      src: url("data:font/ttf;base64,{{NUNITO_ITALIC}}") format("ttf");
      font-style: italic;
    }

    body{
      margin:0;
      background:#efefef;
      font-family: "Nunito", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--ink);
    }
    @media screen {
      body{ display:flex; justify-content:center; padding: 24px; }
    }
  </style>
</head>

<body>
<div class="sheet">
  <div class="guides" aria-hidden="true">
    <div class="guide g-top"></div>
    <div class="guide g-bottom"></div>
    <div class="guide g-left"></div>
    <div class="guide g-right"></div>
  </div>

  <div class="watermark" aria-hidden="true">
    <img src="data:image/png;base64,{{WATERMARK_BASE64}}" alt="" />
  </div>

  <div class="content">
    <div class="header">
      <h1>Second conditional, answers</h1>
    </div>

    <div class="list">
      <!-- injected items -->
    </div>
    <div class="spacer"></div>
  </div>

  <!-- bottom logo -->
  <div class="logo" aria-hidden="true">
    <img src="data:image/png;base64,{{WATERMARK_BASE64}}" alt="" />
  </div>
</div>
</body>
</html>
